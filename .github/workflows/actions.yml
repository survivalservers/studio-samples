# Refuses any action, including one called inside another action, that is not pinned to a full commit and listed
# in .github/allowed-actions.txt (which mirrors the repository's Actions setting).
name: actions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  actions:
    name: Every action, nested ones included, is allowed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the actions the workflows use, and the actions those call
        run: python3 .github/scripts/check-actions.py

      # Publishing (anything holding the trusted-publisher id-token, registry pushes, releases) runs only on GitHub's
      # hosted runners, never on a self-hosted one.
      - name: No publishing job can run on a self-hosted runner
        run: python3 -I .github/scripts/check-publish-runners.py .github/workflows
