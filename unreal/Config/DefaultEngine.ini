; The server opens the engine's empty Entry map with the sample's game mode; replace with your own.
[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Entry
ServerDefaultMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/GameServerSample.GameServerSampleGameMode

; The cache server the editor and the cook start (zenserver, TCP 8558) listens on this machine only, not on every
; network interface (the engine's default).
[Zen.AutoLaunch]
RemoteNetworkService=None
